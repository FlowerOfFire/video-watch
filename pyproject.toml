[project]
name = "video-watch"
version = "0.1.0"
description = "Agent-friendly video reading pipeline: adaptive PySceneDetect + deduplicated keyframe grids and original-language subtitle / Qwen3-ASR alignment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "HYFlower", email = "236282347+FlowerOfFire@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = ["video", "agent-skill", "scenedetect", "keyframe", "asr", "bilibili", "subtitle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "imagehash>=4.3.2",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.1.0",
    "scenedetect>=0.6.4",
]

[project.scripts]
video-watch = "video_watch:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"
